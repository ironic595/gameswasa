<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>Referidos WASA - 15%</title>
<style>
body{background:#0f172a;color:#e2e8f0;font-family:Inter;padding:20px}
.card{max-width:800px;margin:0 auto 16px;background:#1e293b;border:1px solid #22c55e33;border-radius:16px;padding:20px}
.btn{background:#22c55e;color:#000;padding:10px 16px;border-radius:10px;font-weight:800;border:0;cursor:pointer}
input{width:100%;background:#020617;border:1px solid #22c55e55;border-radius:10px;padding:12px;color:#fff}
</style>
</head>
<body>
<div class="card">
<h2>💰 Referidos 15% de por vida</h2>
<p>Compartí tu link y ganá 15% extra en $WASA de lo que farmeen y compren tus referidos.</p>
<input id="refLink" readonly value="Cargando...">
<button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('refLink').value);alert('Copiado')">Copiar</button>
<div id="stats"></div>
</div>
<script>
const WORKER='https://TU_WORKER.workers.dev';
async function load(){
 const email=localStorage.getItem('wasa_email');
 const wallet=localStorage.getItem('wasa_wallet');
 if(!email&&!wallet){document.getElementById('refLink').value='Logeate primero en games.wasa.chat';return;}
 const qs=new URLSearchParams({action:'referral_stats'}); if(email)qs.set('email',email); if(wallet)qs.set('wallet',wallet);
 const j=await fetch(WORKER+'?'+qs).then(r=>r.json());
 if(!j.ok){document.getElementById('refLink').value=j.error;return;}
 document.getElementById('refLink').value=j.referral_link;
 document.getElementById('stats').innerHTML=`Referidos: ${j.total_referrals} | Ganado: ${j.total_earned} $WASA`;
}
load();
</script>
</body>
</html>
